name: In-game test report
description: Report the result of a check done in the real WoW Forever client (probe M0 or a milestone checklist).
title: "[In-game] "
labels: ["in-game", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for the checks that only the real client can answer (docs/specs/SPEC-08-quality-probe-release.md).
        **Privacy:** replace player, guild and account names with placeholders.
  - type: input
    id: check
    attributes:
      label: Check
      description: The id of the check, for example P3 (threat values in an instance) or the checklist and step, such as M2 step 4.
      placeholder: "P3"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Game client
      description: The `client:` and `locale:` lines of the `/atw debug` report (or of the probe export in M0).
      placeholder: "1.60.1 (build 70170), enUS"
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: Context
      options:
        - Solo, open world
        - Party, open world
        - Dungeon
        - Raid
        - Battleground or other
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works as the spec expects
        - Works differently (details below)
        - Does not work
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What you did and what you saw
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: The /atw debug report or the probe export (optional, recommended)
      description: Type `/atw debug` (or `/atwp export` in M0), press Ctrl+C in the box and paste it here. It contains no player names.
      render: text
