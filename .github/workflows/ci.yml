name: CI

# Checks on every pull request and on every push to main. The job name "Tests" is the status check required by the
# branch protection of main (ADR 0008). It runs the documentation checks, the package check and the offline addon tests
# (Tests/run_tests.py: Lua 5.1 through lupa on a mock client, ADR 0010). The runner has no API dump, so the tests do not
# validate event names here; they do on a PC with ../WoW-Addons next to the repository.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # lupa embeds Lua 5.1: the probe syntax check and the addon tests need it.
      - name: Install lupa
        run: python -m pip install lupa==2.8

      # Lua syntax, TOC and packaging rule of the probe addon; --require: never skipped in CI.
      - name: Check the probe addon
        run: python -I -X utf8 tools/check_probe.py --require

      # Links, wiki sidebar and links, ADR index, privacy scan, LF line endings, the docs rule's own cases.
      - name: Check the documentation
        run: python -I -X utf8 tools/check_docs.py

      # What .pkgmeta would put in the release zip (from M1.2 on).
      - name: Check the package contents
        if: hashFiles('tools/check_package.py') != ''
        run: python -I -X utf8 tools/check_package.py

      # The libraries are pinned in .pkgmeta and never committed. They are cached on the pins, so a run only downloads
      # when a pin changes; fetch_libs.py also retries with backoff on 429 and 5xx.
      - name: Cache the libraries
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: AzerothThreatwarden/Libs
          key: libs-${{ hashFiles('.pkgmeta', 'tools/fetch_libs.py') }}

      # The quick tests only; the long scenarios are the "Long tests" workflow.
      - name: Run the addon tests
        run: |
          python -I -X utf8 tools/fetch_libs.py
          python -I -X utf8 Tests/run_tests.py
